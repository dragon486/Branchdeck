version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: branchdeck-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: branchdeck
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d branchdeck"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: branchdeck-backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/branchdeck
      - BRANCHDECK_ENV=production
      - ALLOWED_ORIGINS=http://localhost:3000,http://localhost:3001
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET:-dev_jwt_secret_change_me_in_prod_32chars}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  webapp:
    build:
      context: ./webapp
      dockerfile: Dockerfile
    container_name: branchdeck-webapp
    restart: always
    environment:
      - BACKEND_URL=http://backend:8000
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL:-}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET:-dev_jwt_secret_change_me_in_prod_32chars}
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
